<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Градиент фона (squircle) -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d6e4f5"/>
    </linearGradient>

    <!-- Градиент галочки -->
    <linearGradient id="checkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8dcf2"/>
      <stop offset="50%" stop-color="#a8c6e8"/>
      <stop offset="100%" stop-color="#7aa3d4"/>
    </linearGradient>

    <!-- Легкая тень -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle-фон -->
  <rect x="10" y="10" width="492" height="492" rx="110" ry="110" fill="url(#bgGrad)"/>

  <!-- MacBook: экран -->
  <g stroke="#c9d4e0" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Внешняя рамка экрана -->
    <rect x="130" y="155" width="252" height="175" rx="10" ry="10"/>
    <!-- Внутренний дисплей -->
    <rect x="142" y="167" width="228" height="151" rx="4" ry="4" stroke="#e0e6ee" stroke-width="1.5"/>
    <!-- Камера -->
    <circle cx="256" cy="161" r="2" fill="#c9d4e0" stroke="none"/>

    <!-- База (клавиатура) -->
    <path d="M 100 335 L 412 335 L 420 352 Q 420 358 414 358 L 98 358 Q 92 358 92 352 Z"/>
    <!-- Вырез для открытия крышки -->
    <path d="M 230 345 Q 256 340 282 345" stroke="#b8c4d2" stroke-width="1.5"/>
  </g>

  <!-- Галочка (checkmark) -->
  <path d="M 290 295 L 320 325 L 380 255"
        fill="none"
        stroke="url(#checkGrad)"
        stroke-width="14"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#softShadow)"/>
</svg>